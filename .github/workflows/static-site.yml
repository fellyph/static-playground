name: Publish theme site to Spacefast
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://fixture.example' }}
      SPACEFAST_SPACE: ${{ vars.SPACEFAST_SPACE }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: command -v wget >/dev/null || (sudo apt-get update && sudo apt-get install -y wget)
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Test committed theme in the Site Editor
        run: npm run test:theme
      - name: Verify theme-only edits reach the static site
        run: npm run test:theme-build
      - name: Verify use from another repository
        run: npm run test:action
      - name: Build and validate site with the reusable action
        uses: ./
        with:
          mode: build
          theme-path: themes/southbound
          theme-slug: southbound
          production-url: ${{ vars.PRODUCTION_URL || 'https://fixture.example' }}
      - name: Write failed build summary
        if: failure()
        run: node scripts/summary.mjs
      - name: Publishing setup status
        if: vars.PRODUCTION_URL == '' || vars.SPACEFAST_SPACE == ''
        run: echo 'Build validated. Configure PRODUCTION_URL, SPACEFAST_SPACE and SPACEFAST_TOKEN to enable publishing.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: |
            reports/
            .cache/fixture/reports/
            .cache/theme-build-test/reports/
            .cache/action-test/reports/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_URL != '' && vars.SPACEFAST_SPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: spacefast-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      SPACEFAST_SPACE: ${{ vars.SPACEFAST_SPACE }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: static-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: validation-${{ github.sha }}
          path: downloaded-reports
      - run: mkdir -p reports && cp downloaded-reports/reports/build.json reports/build.json
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - name: Publish validated output
        if: steps.current.outputs.publish == 'true'
        uses: ./
        with:
          mode: publish
          production-url: ${{ vars.PRODUCTION_URL }}
          spacefast-space: ${{ vars.SPACEFAST_SPACE }}
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
      - name: Write failed deployment summary
        if: failure()
        run: node scripts/summary.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deployment-${{ github.sha }}
          path: reports/deployment.json
          if-no-files-found: ignore
